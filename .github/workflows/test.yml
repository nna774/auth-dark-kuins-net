name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # 新しい runner には各系列の最新の patch しか無く、.ruby-version の版が入らないことがある。
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake test
