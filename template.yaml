AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Parameters:
  GithubKey:
    Type: String
    NoEcho: true
  GithubSecret:
    Type: String
    NoEcho: true
  RackSessionKey:
    Type: String
    NoEcho: true
  RackSessionSecret:
    Type: String
    NoEcho: true
Resources:
  ApiGateway:
    Name: auth-dark-kuins-net
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Domain:
        CertificateArn: arn:aws:acm:ap-northeast-1:486414336274:certificate/5b205c4d-aec3-4ee1-b5e5-3b338026dcf4 # *.dark-kuins.neet
        DomainName: auth.dark-kuins.net
  Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: main.Main.handle
      Runtime: ruby3.4
      Architectures:
        - arm64
      FunctionName: auth-dark-kuins-net
      Timeout: 30
      Environment:
        Variables:
          GITHUB_KEY: !Ref GithubKey
          GITHUB_SECRET: !Ref GithubSecret
          RACK_SESSION_KEY: !Ref RackSessionKey
          RACK_SESSION_SECRET: !Ref RackSessionSecret
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway

Outputs:
  API:
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/"
